<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Loja de Bicicletas (Copa Edition)</title>
    <style>
        :root {
            --verde-copa: #009739;
            --amarelo-copa: #FFDF00;
            --azul-copa: #002776;
            --branco: #ffffff;
            --cinza-claro: #f4f4f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-claro);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .form-container {
            background: var(--branco);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-top: 10px solid var(--verde-copa);
        }

        .header-image {
            width: 100%;
            height: 180px;
            background: var(--azul-copa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amarelo-copa);
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background-image: linear-gradient(rgba(0,39,118,0.7), rgba(0,39,118,0.7)), url('https://images.unsplash.com/photo-1485965120184-e220f721d03e?auto=format&fit=crop&q=80&w=600');
            background-size: cover;
        }

        .content { padding: 30px; }
        h1 { color: var(--azul-copa); font-size: 22px; margin-bottom: 10px; }
        .question { margin-bottom: 25px; }
        .question label { display: block; font-weight: bold; margin-bottom: 10px; color: #333; }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: var(--verde-copa);
            color: var(--branco);
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-image">
        Rumo ao Hexa com a Bicicleta do Brasil! ⚽🚴
    </div>
    
    <div class="content">
        <h1>Avaliação da Experiência</h1>
        
        <form action="https://docs.google.com/forms/d/e/1FAIpQLSdEjvxOEOD1wQ27fqe4JG6eXhhxx4FKX2re0qKBTX-Z_O2wjg/formResponse" method="POST">
            
            <div class="question">
                <label>Nome do Ciclista</label>
                <input type="text" name="entry.52746291" placeholder="Ex: EXEMPLO_NOME" required>
            </div>

            <div class="question">
                <label>Nota para o Aplicativo (1 a 5)</label>
                <select name="entry.1016399091" required>
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Muito Bom</option>
                    <option value="3">3 - Regular</option>
                    <option value="2">2 - Precisa Melhorar</option>
                    <option value="1">1 - Ruim</option>
                </select>
            </div>

            <div class="question">
                <label>Descreva sua Experiência</label>
                <input type="text" name="entry.1160682750" placeholder="Ex: EXEMPLO_EXPERIENCIA" required>
            </div>

            <div class="question">
                <label>Você indicaria nossa loja?</label>
                <select name="entry.1715074196" required>
                    <option value="Sim">Sim</option>
                    <option value="Não indicaria">Não indicaria</option>
                    <option value="Indicaria, mas com resalvas">Indicaria, mas com resalvas</option>
                    <option value="Indicaria depois de implementar mudanças">Indicaria depois de implementar mudanças</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Enviar Feedback e Marcar esse Golaço!</button>
        </form>
    </div>
</div>

</body>
</html>
